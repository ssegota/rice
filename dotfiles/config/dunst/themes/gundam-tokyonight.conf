# dunst colours — variant: TOKYONIGHT
# As the pre-Gundam dunstrc had them, cards raised one step to #24283b.

[global]
    icon_theme = Papirus-Dark, Papirus, Adwaita

[urgency_low]
    background = "#24283b"
    foreground = "#a9b1d6"
    frame_color = "#414868"
    highlight = "#7aa2f7"

[urgency_normal]
    background = "#24283b"
    foreground = "#c0caf5"
    frame_color = "#7aa2f7"
    highlight = "#7aa2f7"

[urgency_critical]
    background = "#24283b"
    foreground = "#c0caf5"
    frame_color = "#f7768e"
    highlight = "#f7768e"
