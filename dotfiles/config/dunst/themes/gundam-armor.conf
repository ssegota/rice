# dunst colours — variant A: ARMOR
# A notification is a .svc row lifted off the dashboard: raised armour card,
# grey seam, 4px colour-coded frame saying how much you should care.
# Loaded as a drop-in; gundam-theme repoints dunstrc.d/50-gundam-active.conf.

[global]
    # Light cards want the light icon set.
    icon_theme = Papirus, Papirus-Light, Adwaita

# Low: a quiet panel. Grey seam, secondary ink — the page's .dev row.
[urgency_low]
    background = "#f8f9f6"
    foreground = "#545a66"
    frame_color = "#b0b3ac"
    highlight = "#24408e"

# Normal: Federation blue rule, full-strength ink — the page's .svc row.
[urgency_normal]
    background = "#f8f9f6"
    foreground = "#15181f"
    frame_color = "#24408e"
    highlight = "#24408e"

# Critical: chest red, and the card goes a shade brighter than every other
# card so it cannot be mistaken for an ordinary notification at a glance.
[urgency_critical]
    background = "#ffffff"
    foreground = "#15181f"
    frame_color = "#c0272d"
    highlight = "#c0272d"
