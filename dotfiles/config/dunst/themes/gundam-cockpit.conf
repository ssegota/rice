# dunst colours — variant C: COCKPIT
# The card still sits above its ground, only now the ground is the cockpit
# black and "raised" means lighter by the same step (#12141a -> #1b1f28).
# Frames use the lifted Federation hues; #24408e on this card is 1.5:1.

[global]
    # Dark cards want the dark icon set.
    icon_theme = Papirus-Dark, Papirus, Adwaita

[urgency_low]
    background = "#1b1f28"
    foreground = "#8b93a7"
    frame_color = "#2f3646"
    highlight = "#5b83d6"

[urgency_normal]
    background = "#1b1f28"
    foreground = "#e8eaf2"
    frame_color = "#5b83d6"
    highlight = "#5b83d6"

# Critical cannot go brighter here without leaving the theme, so it goes
# red-lit instead: the card itself takes a deep red cast under the red frame.
[urgency_critical]
    background = "#2a1114"
    foreground = "#e8eaf2"
    frame_color = "#e63946"
    highlight = "#e63946"
