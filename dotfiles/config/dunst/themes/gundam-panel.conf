# dunst colours — variant B: PANEL
# Same cards, stepped down with the ground: the raised surface is now --armor
# rather than --armor-hi, and the seam deepens to keep its edge on the grey.

[global]
    icon_theme = Papirus, Papirus-Light, Adwaita

[urgency_low]
    background = "#e6e7e2"
    foreground = "#545a66"
    frame_color = "#9ca098"
    highlight = "#24408e"

[urgency_normal]
    background = "#e6e7e2"
    foreground = "#15181f"
    frame_color = "#24408e"
    highlight = "#24408e"

# Still the brightest card on screen, one step above the normal one.
[urgency_critical]
    background = "#f8f9f6"
    foreground = "#15181f"
    frame_color = "#c0272d"
    highlight = "#c0272d"
