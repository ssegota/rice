# dunst colours — variant: THINKPAD (P14s Gen 5)
# Cards a step above the black chassis, silver frames; critical gets the
# TrackPoint red frame on a red-cast card.

[global]
    icon_theme = Papirus-Dark, Papirus, Adwaita

[urgency_low]
    background = "#1f1f1f"
    foreground = "#8a8a8a"
    frame_color = "#333333"
    highlight = "#b4b4b4"

[urgency_normal]
    background = "#1f1f1f"
    foreground = "#e8e8e8"
    frame_color = "#b4b4b4"
    highlight = "#e2231a"

[urgency_critical]
    background = "#2a1110"
    foreground = "#e8e8e8"
    frame_color = "#e2231a"
    highlight = "#e2231a"
