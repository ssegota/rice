# gundam-theme — which wallpaper each variant wears.
#
#     <variant>  <image> [<image> ...]
#
# One image per monitor, in xrandr/Xinerama order — the order feh assigns them
# in, and the same order ~/.fehbg records. feh repeats the last image when the
# list is shorter than the monitor count and ignores the extras when it is
# longer, so one line can cover docked and undocked both.
#
# Bare names resolve against ~/Pictures/wallpapers; absolute paths and ~ work
# too. The line is split on whitespace, so a filename containing spaces needs
# a symlink without them.
#
# Delete or comment out a variant's line to have gundam-theme leave the
# wallpaper alone when switching to it. `gundam-theme <variant> -k` skips the
# wallpaper for one switch without editing this file. Picking a wallpaper by
# hand afterwards (Super+Shift+w) still wins until the next switch.
#
# The trailing numbers are mean luminance in percent, which is how these were
# sorted into variants in the first place:
#
#     identify -format '%[fx:mean*100]' <file>
#
# Monitors here, in order: eDP-1 1920x1200, DP-1-1 1280x1024, DP-1-3 1920x1080.

# armor and panel deliberately share a set — they are the same room in two
# lights, and the wallpaper is not what tells them apart.
armor    gundam-e78r2w.png gundam-8gg3lo.jpg gundam-pko5gj.png   # 83 63 89
panel    gundam-e78r2w.png gundam-8gg3lo.jpg gundam-pko5gj.png   # 83 63 89
cockpit  gundam-d6edoj.png tokyo-gundam.jpeg gundam-x8qmld.jpg   # 14 18 37
