[colors]
background=#802E3440
foreground=#D8DEE9
primary=#81A1C1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; MAIN BAR (primary monitor, autohide)
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/main]
monitor = ${env:MONITOR:}
width=100%
height=30
background=${colors.background}
foreground=${colors.foreground}
enable-ipc = true

; float above windows instead of reserving a strut, so hiding
; the bar does not leave a 30px empty gap
override-redirect = true
hidden = true

font-0="JetBrainsMonoNerdFont:size=12;2"
font-1="JetBrainsMonoNerdFont:size=15;3"

modules-left=i3 firefox nautilus vscode terminator
modules-center=date
modules-right=brightness cpu ram disk network volume battery wifi-menu tray

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; SECONDARY BARS (other monitors, autohide)
;; workspaces + clock only. No tray: only one polybar
;; instance may own the system tray.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/secondary]
monitor = ${env:MONITOR:}
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
enable-ipc = true

override-redirect = true
hidden = true

font-0 = "JetBrainsMonoNerdFont:size=12;2"
font-1 = "JetBrainsMonoNerdFont:size=15;3"

modules-left = i3
modules-center = date
modules-right =

[module/space]
type = custom/text
format = "|"
padding=1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;I3MODULE
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/i3]
type = internal/i3

; Only show workspaces defined on the same output as the bar
pin-workspaces = true

; This is the magic part: styling the active workspace
label-focused = %index%
label-focused-foreground = #ffffff
label-focused-background = #3f3f3f
label-focused-underline = #fba922
label-focused-padding = 1

; Styles for workspaces that are NOT active
label-unfocused = %index%
label-unfocused-padding = 1

; Styles for workspaces that are open on a different monitor
label-visible = %index%
label-visible-underline = #555555
label-visible-padding = 1

; Styles for workspaces with a "beep" or notification
label-urgent = %index%
label-urgent-foreground = #000000
label-urgent-background = #bd2c40
label-urgent-padding = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;DATE
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/date]
type = internal/date
interval = 1
date = "%a %Y-%m-%d %H:%M"
label = %date%

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;VOLUME
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/volume]
type=internal/pulseaudio
interval=2

label-volume=󰕾 %percentage%%
format-volume=<label-volume>

label-muted=󰖁 Muted
format-muted=<label-muted>
format-padding = 1

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 5

format = <label>
label =  %output%
label-padding = 2

click-left = blueman-manager &
click-right = bluetoothctl power toggle

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;WIFI
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/wlan]
#type=internal/network
#interface=wlp0s20f3

type = custom/script
exec = echo "󰤨"
# This opens the menu when you left-click the icon
click-left = networkmanager_dmenu
interval = 1
format-foreground = #ffffff

# This line makes the module clickable!
#click-left = kitty -e nmtui  # Replace 'st' with your terminal (e.g., kitty, alacritty, gnome-terminal)

#format-connected = <label-connected>
#label-connected =  %essid%(%signal%%)
#label-connected-foreground = #61afef

#format-disconnected = <label-disconnected>
#label-disconnected = 󰖪 Disconnected
#label-disconnected-foreground = #e06c75


[module/wifi-menu]
type = custom/script

; show current connection status
exec = ~/.config/polybar/scripts/wifi-status.sh

; refresh every 5 seconds
interval = 5

; left-click opens the network selector menu
click-left = ~/.config/polybar/scripts/wifi-menu.sh

; right-click disconnects immediately (optional shortcut)
; click-right = nmcli device disconnect <your-iface>

; scroll up/down can cycle through saved networks (optional — remove if unwanted)
; scroll-up   = nmcli connection up "$(nmcli -t -f name con show | head -1)"
; scroll-down = nmcli device disconnect <your-iface>

label = %output%
label-padding = 1

; tweak colours to match your bar theme
format-foreground = ${colors.foreground}
format-background = ${colors.background}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;BATTERY
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/battery]
type=internal/battery
battery=BAT0
adapter=AC

label-discharging=󱊣 %percentage%%
format-discharging=<label-discharging>

label-full=󱊣 100%
format-full=<label-full>

label-charging=󰂄 %percentage%%
format-charging=<label-charging>
format-padding = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;TRAY
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/tray]
type=internal/tray
tray-size=18
format-padding = 1

#######################################
#ApplicationLauncherModules
#######################################

[module/firefox]
type=custom/text
format="󰈹"
format-font=1
click-left=firefox&
format-padding = 1

[module/nautilus]
type=custom/text
format="󰉋"
format-font=1
click-left=nemo&
format-padding = 1

[module/vscode]
type=custom/text
format="󰨞"
format-font=1
click-left=antigravity&
format-padding = 1

[module/terminator]
type=custom/text
format=""
format-font=1
click-left=warp-terminal&
format-padding = 1

[module/termius]
type=custom/text
format="󰌆"
format-font=1
click-left=termius-app&
format-padding = 1

[module/telegram]
type=custom/text
format=""
format-font=1
click-left=telegram-desktop&
format-padding = 1

[module/signal]
type=custom/text
format="󰭡"
format-font=1
click-left=signal-desktop&
format-padding = 1

[module/teams]
type=custom/text
format="󰊻"
format-font=1
format-padding = 1
click-left=teams-for-linux&

########################################
# CPU USAGE
########################################
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 1
label = " %percentage%%"
label-font = 1

########################################
# RAM USAGE
########################################
[module/ram]
type = internal/memory
interval = 2
format = <label>
format-padding = 1
label = "󰍛 %percentage_used%%"
label-font = 1

########################################
# DISK FREE SPACE (ROOT PARTITION)
########################################
[module/disk]
type = custom/script
exec = ~/.config/polybar/scripts/disk.sh
interval = 30

format = "<label>"
format-font = 1
format-padding = 1

label = %output%

########################################
# NETWORK SPEED (AUTO INTERFACE)
########################################
[module/network]
type = internal/network
interface = wlp0s20f3
interval = 1
format-connected = "<label-connected>"
format-disconnected = "󰤭"
format-padding = 1

label-connected = "󰜮 %downspeed% 󰜷 %upspeed%"
label-connected-font = 1

########################################
# BRIGHTNESS (AS PERCENTAGE)
########################################
[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
exec-if = command -v brightnessctl
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-
interval = 1
format-padding = 1
