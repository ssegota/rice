; Gundam RX-78-2 "Federation Armor" — polybar
;
; The bar is the armour panel: white ground, grey seam along the bottom,
; Federation-blue slab under the focused workspace, chest red for anything
; urgent. Same eleven colours as the homelab dashboard the rice is drawn from
; (~/.config/gundam/palette.md).
;
; Note on yellow: V-fin yellow is a *fill*, not a text colour — at ~1.6:1 on
; armour white it is unreadable. Modules that need to warn in yellow use the
; dashboard's own readable substitute, #7d5a00, and keep #f0b929 for slabs.

[colors]
; #AARRGGBB — very slightly translucent so wallpaper reads through the panel
background = #f2e6e7e2
foreground = #15181f

armor      = #e6e7e2
armor-hi   = #f8f9f6
armor-lo   = #d2d4ce
line       = #b0b3ac
ink        = #15181f
ink-dim    = #545a66
blue       = #24408e
blue-deep  = #1a2f6b
red        = #c0272d
yellow     = #f0b929
yellow-ink = #7d5a00
eye        = #3f9e56
white      = #ffffff

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; MAIN BAR (primary monitor, autohide)
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/main]
monitor = ${env:MONITOR:}
width=100%
height=30
background=${colors.background}
foreground=${colors.foreground}
enable-ipc = true

; float above windows instead of reserving a strut, so hiding
; the bar does not leave a 30px empty gap
override-redirect = true
hidden = true

; Panel seam along the bottom edge — the dashboard's 1px --line border.
border-bottom-size = 1
border-bottom-color = ${colors.line}

; Underline thickness for the per-module trim rules below.
line-size = 3

font-0="JetBrainsMonoNerdFont:size=12;2"
font-1="JetBrainsMonoNerdFont:size=15;3"

modules-left=i3 sep firefox nautilus vscode terminator
modules-center=date
; cpu, ram, disk and network are still defined further down but deliberately
; not on the bar — btop covers them. Re-add the names here to bring them back.
modules-right=brightness volume battery wifi-menu tray

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; SECONDARY BARS (other monitors, autohide)
;; workspaces + clock only. No tray: only one polybar
;; instance may own the system tray.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/secondary]
monitor = ${env:MONITOR:}
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
enable-ipc = true

override-redirect = true
hidden = true

border-bottom-size = 1
border-bottom-color = ${colors.line}
line-size = 3

font-0 = "JetBrainsMonoNerdFont:size=12;2"
font-1 = "JetBrainsMonoNerdFont:size=15;3"

modules-left = i3
modules-center = date
modules-right =

[module/space]
type = custom/text
format = "|"
padding=1

; Panel seam between the workspace slab and the launcher rail — stands in for
; the dashboard's .rule divider.
[module/sep]
type = custom/text
format = "│"
format-foreground = ${colors.line}
format-padding = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;I3MODULE
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/i3]
type = internal/i3

; Only show workspaces defined on the same output as the bar
pin-workspaces = true

; Focused: the masthead slab — blue ground, white numeral, V-fin underline.
label-focused = %index%
label-focused-foreground = ${colors.white}
label-focused-background = ${colors.blue}
label-focused-underline = ${colors.yellow}
label-focused-padding = 1

; Idle workspaces sit quiet in secondary ink, no ground.
label-unfocused = %index%
label-unfocused-foreground = ${colors.ink-dim}
label-unfocused-padding = 1

; Open on another output: readable, but only a grey seam to mark it.
label-visible = %index%
label-visible-foreground = ${colors.ink}
label-visible-background = ${colors.armor-lo}
label-visible-underline = ${colors.line}
label-visible-padding = 1

; Urgent: chest red, white numeral — matches client.urgent in i3.
label-urgent = %index%
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.red}
label-urgent-underline = ${colors.ink}
label-urgent-padding = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;DATE
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/date]
type = internal/date
interval = 1
date = "%a %Y-%m-%d %H:%M"
label = %date%
label-foreground = ${colors.ink}
format-underline = ${colors.blue}
format-padding = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;VOLUME
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/volume]
type=internal/pulseaudio
interval=2

label-volume=󰕾 %percentage%%
format-volume=<label-volume>
format-volume-foreground = ${colors.ink}

; Muted is a state worth noticing, so it takes the red the dashboard gives
; a down service — but as text, not a slab, to keep the bar calm.
label-muted=󰖁 Muted
format-muted=<label-muted>
format-muted-foreground = ${colors.red}
format-padding = 1
format-muted-padding = 1

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 5

format = <label>
label =  %output%
label-padding = 2
format-foreground = ${colors.blue}

click-left = blueman-manager &
click-right = bluetoothctl power toggle

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;WIFI
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/wlan]
#type=internal/network
#interface=wlp0s20f3

type = custom/script
exec = echo "󰤨"
# This opens the menu when you left-click the icon
click-left = networkmanager_dmenu
interval = 1
format-foreground = ${colors.foreground}

# This line makes the module clickable!
#click-left = kitty -e nmtui  # Replace 'st' with your terminal (e.g., kitty, alacritty, gnome-terminal)

#format-connected = <label-connected>
#label-connected =  %essid%(%signal%%)
#label-connected-foreground = #61afef

#format-disconnected = <label-disconnected>
#label-disconnected = 󰖪 Disconnected
#label-disconnected-foreground = #e06c75


[module/wifi-menu]
type = custom/script

; show current connection status
exec = ~/.config/polybar/scripts/wifi-status.sh

; refresh every 5 seconds
interval = 5

; left-click opens the network selector menu
click-left = ~/.config/polybar/scripts/wifi-menu.sh

; right-click disconnects immediately (optional shortcut)
; click-right = nmcli device disconnect <your-iface>

; scroll up/down can cycle through saved networks (optional — remove if unwanted)
; scroll-up   = nmcli connection up "$(nmcli -t -f name con show | head -1)"
; scroll-down = nmcli device disconnect <your-iface>

label = %output%
label-padding = 1

format-foreground = ${colors.ink}
format-underline = ${colors.blue}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;BATTERY
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/battery]
type=internal/battery
battery=BAT0
adapter=AC

; Discharging is the only state that can turn bad, so it gets the traffic
; light: ink → readable yellow → red, thresholds handled by ramp below.
label-discharging=󱊣 %percentage%%
format-discharging=<ramp-capacity> <label-discharging>
format-discharging-padding = 1

label-full=󱊣 100%
format-full=<label-full>
format-full-foreground = ${colors.eye}
format-full-padding = 1

label-charging=󰂄 %percentage%%
format-charging=<label-charging>
format-charging-foreground = ${colors.eye}
format-charging-underline = ${colors.eye}
format-charging-padding = 1

; 0–20% red, 20–40% readable yellow, above that plain ink.
ramp-capacity-0 = 󰁺
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1 = 󰁼
ramp-capacity-1-foreground = ${colors.yellow-ink}
ramp-capacity-2 = 󰁾
ramp-capacity-2-foreground = ${colors.ink}
ramp-capacity-3 = 󰂀
ramp-capacity-3-foreground = ${colors.ink}
ramp-capacity-4 = 󰂂
ramp-capacity-4-foreground = ${colors.eye}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;TRAY
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/tray]
type=internal/tray
tray-size=18
tray-background = ${colors.background}
format-padding = 1

#######################################
#ApplicationLauncherModules
#######################################
# The launcher rail reads as one blue instrument cluster, like the dashboard's
# numbered section codes. Hovering is not a thing polybar does, so the colour
# is constant.

[module/firefox]
type=custom/text
format="󰈹"
format-font=1
format-foreground = ${colors.blue}
click-left=firefox&
format-padding = 1

[module/nautilus]
type=custom/text
format="󰉋"
format-font=1
format-foreground = ${colors.blue}
click-left=nemo&
format-padding = 1

[module/vscode]
type=custom/text
format="󰨞"
format-font=1
format-foreground = ${colors.blue}
click-left=antigravity&
format-padding = 1

[module/terminator]
type=custom/text
format=""
format-font=1
format-foreground = ${colors.blue}
click-left=warp-terminal&
format-padding = 1

[module/termius]
type=custom/text
format="󰌆"
format-font=1
format-foreground = ${colors.blue}
click-left=termius-app&
format-padding = 1

[module/telegram]
type=custom/text
format=""
format-font=1
format-foreground = ${colors.blue}
click-left=telegram-desktop&
format-padding = 1

[module/signal]
type=custom/text
format="󰭡"
format-font=1
format-foreground = ${colors.blue}
click-left=signal-desktop&
format-padding = 1

[module/teams]
type=custom/text
format="󰊻"
format-font=1
format-foreground = ${colors.blue}
format-padding = 1
click-left=teams-for-linux&

########################################
# CPU USAGE
########################################
# The load meters are the dashboard's §03 gauges: blue while nominal, and the
# whole reading turns red once it is worth looking at.
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 1
format-underline = ${colors.blue}
label = " %percentage%%"
label-font = 1
label-foreground = ${colors.ink}

warn-percentage = 85
format-warn = <label-warn>
format-warn-padding = 1
format-warn-underline = ${colors.red}
label-warn = " %percentage%%"
label-warn-font = 1
label-warn-foreground = ${colors.red}

########################################
# RAM USAGE
########################################
[module/ram]
type = internal/memory
interval = 2
format = <label>
format-padding = 1
format-underline = ${colors.blue}
label = "󰍛 %percentage_used%%"
label-font = 1
label-foreground = ${colors.ink}

warn-percentage = 90
format-warn = <label-warn>
format-warn-padding = 1
format-warn-underline = ${colors.red}
label-warn = "󰍛 %percentage_used%%"
label-warn-font = 1
label-warn-foreground = ${colors.red}

########################################
# DISK FREE SPACE (ROOT PARTITION)
########################################
[module/disk]
type = custom/script
exec = ~/.config/polybar/scripts/disk.sh
interval = 30

format = "<label>"
format-font = 1
format-padding = 1
format-underline = ${colors.blue}

label = %output%
label-foreground = ${colors.ink}

########################################
# NETWORK SPEED (AUTO INTERFACE)
########################################
[module/network]
type = internal/network
; pick whatever wireless interface exists instead of hardcoding wlp0s20f3
interface-type = wireless
interval = 1
format-connected = "<label-connected>"
format-connected-underline = ${colors.blue}
format-disconnected = "󰤭"
format-disconnected-foreground = ${colors.red}
format-disconnected-underline = ${colors.red}
format-padding = 1

label-connected = "󰜮 %downspeed% 󰜷 %upspeed%"
label-connected-font = 1
label-connected-foreground = ${colors.ink}

########################################
# BRIGHTNESS (AS PERCENTAGE)
########################################
[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
exec-if = command -v brightnessctl
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-
interval = 1
format-padding = 1
format-foreground = ${colors.ink}
format-underline = ${colors.yellow}
