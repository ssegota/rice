; polybar colours — variant C: COCKPIT
; The same eleven roles inverted onto the cockpit ground. Ground and ink are
; taken from ghostty/themes/gundam-cockpit.conf so the bar and the terminal
; sit on one black; the accents are the Federation hues lifted until they
; clear 4.5:1 on it — #24408e would land at 1.4:1 unchanged.
;
;   blue   #24408e -> #5b83d6      red    #c0272d -> #e63946
;   yellow #f0b929 -> #f6c14e      eye    #3f9e56 -> #7fc76c
;
; yellow-ink inverts too: on armour white V-fin yellow is ~1.6:1 and needs the
; #7d5a00 substitute, but on this ground #f0b929 reads at 10.2:1, so the real
; yellow finally gets to be text.

[colors]
background = #f212141a
foreground = #e8eaf2

armor      = #12141a
armor-hi   = #1b1f28
armor-lo   = #0c0e13
line       = #2f3646
ink        = #e8eaf2
ink-dim    = #8b93a7
blue       = #5b83d6
blue-deep  = #2b3a5e
red        = #e63946
yellow     = #f6c14e
yellow-ink = #f0b929
eye        = #7fc76c
white      = #ffffff

; The slab splits from the text blue here. White on the lifted #5b83d6 is only
; 3.7:1, so the slab drops to blue-deep — which is also the cockpit terminal's
; selection colour, so a selected row in rofi and one in ghostty are one blue.
slab       = #2b3a5e
on-slab    = #e8eaf2
; Near-black on chest red beats white on it (4.4:1 vs 4.2:1) once red is lifted.
on-red     = #12141a
