; polybar colours — variant B: PANEL
; Ground drops to --armor-lo #d2d4ce, the recessed grey, and every surface
; below it steps down by the same (-20,-19,-20) the dashboard uses between
; --armor and --armor-lo. Accents are byte-identical to ARMOR: they were
; picked to hold on both grounds.

[colors]
background = #f2d2d4ce
foreground = #15181f

armor      = #d2d4ce
armor-hi   = #e6e7e2
armor-lo   = #bec1ba
line       = #9ca098
ink        = #15181f
ink-dim    = #545a66
blue       = #24408e
blue-deep  = #1a2f6b
red        = #c0272d
yellow     = #f0b929
yellow-ink = #7d5a00
eye        = #3f9e56
white      = #ffffff

slab       = #24408e
on-slab    = #ffffff
on-red     = #ffffff
