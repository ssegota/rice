; polybar colours — variant: TOKYONIGHT
; The pre-Gundam theme, mapped onto the shared roles. ink-dim is lifted from
; Tokyo Night's #565f89 comment grey (2.4:1) to #868eb8 (4.6:1) so dim labels
; stay readable on the bar.

[colors]
background = #f21a1b26
foreground = #c0caf5

armor      = #1a1b26
armor-hi   = #24283b
armor-lo   = #16161e
line       = #414868
ink        = #c0caf5
ink-dim    = #868eb8
blue       = #7aa2f7
blue-deep  = #283457
red        = #f7768e
yellow     = #e0af68
yellow-ink = #e0af68
eye        = #9ece6a
white      = #ffffff

slab       = #3d59a1
on-slab    = #ffffff
on-red     = #1a1b26
