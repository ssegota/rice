; polybar colours — variant: THINKPAD (P14s Gen 5)
; The laptop is black and grey with exactly one colour on it, so the bar is
; too. The roles keep their names so config.ini needs no changes:
;
;   blue   -> silver lettering #b4b4b4   (underlines, the "primary" accent)
;   slab   -> deep TrackPoint #b5160f    (focused workspace; white on it 6.8:1)
;   red    -> TrackPoint, lifted #f54a40 (alerts; the true #e2231a is 3.9:1
;             as text, so it is kept for borders and fills only)
;   yellow -> amber charge LED           eye -> green Caps-Lock / mute LED

[colors]
background = #f2141414
foreground = #e8e8e8

armor      = #141414
armor-hi   = #1f1f1f
armor-lo   = #0a0a0a
line       = #333333
ink        = #e8e8e8
ink-dim    = #8a8a8a
blue       = #b4b4b4
blue-deep  = #2a2a2a
red        = #f54a40
yellow     = #f2a33a
yellow-ink = #f2a33a
eye        = #4cc76a
white      = #ffffff

slab       = #b5160f
on-slab    = #ffffff
on-red     = #0a0a0a
