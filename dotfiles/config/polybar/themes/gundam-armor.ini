; polybar colours — variant A: ARMOR
; The dashboard's own eleven values, unaltered. White armour panel, grey seam.
; Selected by gundam-theme via the gundam-active.ini symlink.

[colors]
; #AARRGGBB — very slightly translucent so wallpaper reads through the panel
background = #f2e6e7e2
foreground = #15181f

armor      = #e6e7e2
armor-hi   = #f8f9f6
armor-lo   = #d2d4ce
line       = #b0b3ac
ink        = #15181f
ink-dim    = #545a66
blue       = #24408e
blue-deep  = #1a2f6b
red        = #c0272d
yellow     = #f0b929
yellow-ink = #7d5a00
eye        = #3f9e56
white      = #ffffff

; A slab is a filled block of Federation blue (focused workspace, rofi's input
; bar) — distinct from `blue` used as text. On a light ground one colour serves
; both; on COCKPIT they pull apart, so every consumer names which it means.
slab       = #24408e
on-slab    = #ffffff
on-red     = #ffffff
