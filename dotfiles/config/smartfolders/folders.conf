# Smart folders — one per line:   Name | max items | fd arguments
# Each folder is rebuilt as ~/Smart/<Name>/ (symlinks, newest first).
# Search roots are set in ROOTS below. Full fd syntax: `man fdfind`.
#   --changed-within 7d     -e pdf      --size +500M     -i 'regex'
# Lines starting with # are ignored. Run `smartfolders` to refresh now.

ROOTS = ~/Documents ~/Downloads ~/Desktop ~/Dropbox

Recent (7 days)        | 300 | --changed-within 7d
Recent PDFs            | 200 | -e pdf --changed-within 30d
Office docs (30 days)  | 200 | -e docx -e doc -e xlsx -e xls -e pptx -e odt -e ods -e csv --changed-within 30d
Images (30 days)       | 300 | -e png -e jpg -e jpeg -e webp -e heic -e svg --changed-within 30d
Invoices & orders      | 300 | -i '(invoice|ra[cč]un|order|narud[zž]b|ponuda|receipt|transaction|potvrda|confirmation)' -e pdf
Big files in Downloads | 100 | --size +500M --search-path ~/Downloads
Installers & archives  | 200 | -e deb -e AppImage -e zip -e gz -e xz -e 7z -e rar --search-path ~/Downloads
