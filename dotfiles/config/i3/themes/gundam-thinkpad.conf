# i3 window colours — variant: THINKPAD (P14s Gen 5)
# The focused window wears the TrackPoint red; everything else is chassis
# black and grey. Urgent takes the amber charge LED, so it can't be mistaken
# for focus.
# Selected by gundam-theme via the gundam-active.conf symlink.
#
# Class                  Border   Background Text     Indicator Child Border
client.focused           #e2231a  #141414   #e8e8e8  #b4b4b4   #e2231a
client.focused_inactive  #333333  #141414   #8a8a8a  #333333   #333333
client.unfocused         #0a0a0a  #141414   #8a8a8a  #0a0a0a   #0a0a0a
client.urgent            #f2a33a  #141414   #e8e8e8  #f2a33a   #f2a33a
client.background        #141414
