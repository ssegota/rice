# i3 window colours — variant C: COCKPIT
# Borders are the panel seams between armour plates: Federation blue marks the
# plate you are working on, chest red the one shouting at you, and everything
# else recedes to the ground's own greys.
# Selected by gundam-theme via the gundam-active.conf symlink.
#
# Class                  Border   Background Text     Indicator Child Border
#
# The unfocused seam goes *below* the ground here rather than above it — on a
# light theme a plate recedes by getting greyer, on this one by getting darker.
client.focused           #5b83d6  #12141a   #e8eaf2  #f6c14e   #5b83d6
client.focused_inactive  #2f3646  #12141a   #8b93a7  #2f3646   #2f3646
client.unfocused         #0c0e13  #12141a   #8b93a7  #0c0e13   #0c0e13
client.urgent            #e63946  #12141a   #e8eaf2  #e63946   #e63946
client.background        #12141a
