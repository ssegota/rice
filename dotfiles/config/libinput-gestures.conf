############################################
# i3 + libinput-gestures
# Author: Sandi Baressi Šegota 😈
# Touchpad gestures for X11 / i3
############################################


############################################
# WORKSPACE NAVIGATION
############################################

# 3-finger swipe: cycle workspaces
gesture swipe left 3  i3-msg workspace prev
gesture swipe right 3 i3-msg workspace next

# 3-finger vertical swipe: context control
gesture swipe up 3    i3-msg workspace back_and_forth
#gesture swipe down 3  i3-msg workspace number 1


############################################
# MOVE WINDOWS BETWEEN WORKSPACES / OUTPUTS
############################################

# 4-finger swipe: move container
#gesture swipe left 4  i3-msg move container to workspace prev
#gesture swipe right 4 i3-msg move container to workspace next

# 4-finger vertical swipe: focus outputs
#gesture swipe up 4    i3-msg focus output right
#gesture swipe down 4  i3-msg focus output left


############################################
# WINDOW FOCUS (SPATIAL NAVIGATION)
############################################

# 2-finger swipe: directional focus
#gesture swipe left 2  i3-msg focus left
#gesture swipe right 2 i3-msg focus right
#gesture swipe up 2    i3-msg focus up
#gesture swipe down 2  i3-msg focus down


############################################
# WINDOW STATE & LAYOUT
############################################

# Floating / tiling
#gesture pinch in 2    i3-msg floating enable
#gesture pinch out 2   i3-msg floating disable

# Fullscreen / split toggle
#gesture pinch in 3    i3-msg fullscreen toggle
#gesture pinch out 3   i3-msg layout toggle split

# Layout modes
#gesture swipe up 4    i3-msg layout tabbed
#gesture swipe down 4  i3-msg layout stacking


############################################
# SCRATCHPAD & CONTEXT
############################################

# Scratchpad toggle
#gesture swipe down 3  i3-msg scratchpad show

# Focus urgent window
#gesture swipe up 3    i3-msg [urgent=latest] focus


############################################
# APP LAUNCH & SYSTEM ACTIONS
############################################

# Launcher & terminal
#gesture pinch in 4    exec rofi -show drun
#gesture pinch out 4   exec alacritty

# Screenshot
#gesture pinch in 2    exec flameshot gui

# Lock screen (safe system action)
#gesture pinch in 4    exec i3lock -c 000000


############################################
# AUDIO (OPTIONAL / ADVANCED)
############################################

# Volume control (5 fingers = deliberate)
#gesture swipe up 5    exec pactl set-sink-volume @DEFAULT_SINK@ +5%
#gesture swipe down 5  exec pactl set-sink-volume @DEFAULT_SINK@ -5%


############################################
# END OF FILE
############################################

