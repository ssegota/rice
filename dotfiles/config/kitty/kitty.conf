# ~/.config/kitty/kitty.conf
# Gundam RX-78-2 — a port of ~/.config/ghostty/config, option for option, so the
# two terminals look and behave the same. Palette is byte-identical to ghostty's
# and to the starship prompt in ~/.config/starship.toml.
#
# Reload after editing:  ctrl+shift+f5
# Show what kitty actually parsed:  kitty --debug-config

# ── Font ─────────────────────────────────────────────────────────────────────
# Same face and size as ghostty, so the powerline bubble caps in the starship
# prompt line up identically in both terminals.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Ligatures on (ghostty: font-feature = calt / liga). kitty enables both by
# default; this only stops kitty from disabling them near the cursor.
disable_ligatures never

# ghostty's font-thicken has no equivalent on Linux kitty — this is the default,
# stated explicitly so it's clear nothing was missed. If text looks thinner than
# in ghostty, try: text_composition_strategy legacy
text_composition_strategy platform

# ── Colors: Gundam RX-78-2 "Federation Armor" ────────────────────────────────
# Colours (and background_opacity, which differs per variant) live in themes/.
# gundam-active.conf is a symlink shared in spirit with ghostty's — repoint both
# at once with `gundam-theme armor|panel|cockpit`.
include themes/gundam-active.conf

# ── Window & background ──────────────────────────────────────────────────────
# ghostty: background-blur-radius = 20. Honored on KDE/Wayland, ignored on i3+X11
# (harmless either way — same as in the ghostty config).
background_blur 20

# ghostty: window-padding-x = 12 / window-padding-y = 8
# kitty order is vertical then horizontal.
window_padding_width 8 12

hide_window_decorations no
confirm_os_window_close 0

# ── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape           beam
cursor_blink_interval  0

# ── Behavior / quality of life ───────────────────────────────────────────────
mouse_hide_wait   3.0
copy_on_select    clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary
scrollback_lines  100000
shell_integration enabled
enable_audio_bell no

# ── Splits, to mirror the two ghostty keybinds ───────────────────────────────
# ghostty: ctrl+shift+enter = new_split:right, ctrl+shift+minus = new_split:down
enabled_layouts splits:split_axis=horizontal,stack
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current

# Move between and resize splits (kitty needs these spelled out; ghostty has
# defaults for them).
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+z toggle_layout stack
