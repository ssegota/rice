# Gundam RX-78-2 — variant A: ARMOR (kitty)
# Port of ~/.config/ghostty/themes/gundam-armor.conf, value for value.
# Ground is the dashboard's --armor #e6e7e2.

background            #e6e7e2
foreground            #15181f
cursor                #c0272d
cursor_text_color     #ffffff
selection_background  #bcc7e6
selection_foreground  #15181f

# Normal — the page's own hues
color0  #545a66
color1  #c0272d
color2  #3f9e56
color3  #b5820f
color4  #24408e
color5  #a4407c
color6  #1a6b7d
color7  #8b8e88
# Bright — deepened for emphasis (see the ghostty file for why)
color8  #6b7280
color9  #9d1f24
color10 #2c6f3c
color11 #7d5a00
color12 #1a2f6b
color13 #7d2a5e
color14 #0f5260
color15 #b0b3ac

# Tabs and borders: the active tab is the masthead slab, blue with white text.
active_tab_background   #24408e
active_tab_foreground   #ffffff
inactive_tab_background #d2d4ce
inactive_tab_foreground #545a66
tab_bar_background      #e6e7e2
active_border_color     #24408e
inactive_border_color   #b0b3ac
bell_border_color       #c0272d
url_color               #1a6b7d

background_opacity 0.97
