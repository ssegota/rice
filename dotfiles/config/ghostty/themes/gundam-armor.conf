# Gundam RX-78-2 — variant A: ARMOR
# Background is the dashboard's own body colour, --armor #e6e7e2: a warm
# off-white with a green cast. Brightest of the two light variants, and an
# exact match for the page.
#
# Switch variants with:  gundam-theme armor | panel | cockpit
# Palette + reasoning:   ~/.config/gundam/palette.md

background = #e6e7e2
foreground = #15181f

# Chest red for the cursor — the one thing on an armour panel that moves.
cursor-color = #c0272d
cursor-text = #ffffff

# Federation blue, lightened until text stays legible through it.
selection-background = #bcc7e6
selection-foreground = #15181f

# ── ANSI ────────────────────────────────────────────────────────────────────
# Two adjustments from the raw page palette, both forced by a light ground:
#
#   yellow  #f0b929 measures ~1.6:1 against #e6e7e2 — invisible as text. The
#           page hits the same wall and prints its warnings in #7d5a00, so
#           that is what yellow means here. #f0b929 survives as a fill in
#           polybar and i3 where it sits on ink, not armour.
#   bright  On a light ground "brighter" would mean "lower contrast", so the
#           bright half is *deeper* instead — emphasis, the way Solarized
#           Light handles it. Bright text reads as more important, not less.

# Normal — the page's own hues
palette = 0=#545a66
palette = 1=#c0272d
palette = 2=#3f9e56
palette = 3=#b5820f
palette = 4=#24408e
palette = 5=#a4407c
palette = 6=#1a6b7d
palette = 7=#8b8e88
# Bright — deepened for emphasis
palette = 8=#6b7280
palette = 9=#9d1f24
palette = 10=#2c6f3c
palette = 11=#7d5a00
palette = 12=#1a2f6b
palette = 13=#7d2a5e
palette = 14=#0f5260
palette = 15=#b0b3ac

# Light grounds go muddy over a busy wallpaper far faster than dark ones, so
# this is nearly opaque where the old cockpit theme sat at 0.95.
background-opacity = 0.97
