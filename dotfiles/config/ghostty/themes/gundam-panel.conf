# Gundam RX-78-2 — variant B: PANEL
# Background is --armor-lo #d2d4ce, the grey the dashboard uses for recessed
# surfaces (meter tracks, inset path fields). Same family as ARMOR, about 15%
# darker — less glare in a dim room, and the blue/red accents sit heavier on it.
#
# The ANSI palette is byte-identical to ARMOR: every colour there was picked to
# stay legible on both grounds, so switching variants changes only the ground.
#
# Switch variants with:  gundam-theme armor | panel | cockpit
# Palette + reasoning:   ~/.config/gundam/palette.md

background = #d2d4ce
foreground = #15181f

cursor-color = #c0272d
cursor-text = #ffffff

# Pulled a shade deeper than ARMOR's so the selection still separates from the
# darker ground.
selection-background = #aeb9d8
selection-foreground = #15181f

# ── ANSI (identical to gundam-armor.conf) ───────────────────────────────────
# Normal — the page's own hues
palette = 0=#545a66
palette = 1=#c0272d
palette = 2=#3f9e56
palette = 3=#b5820f
palette = 4=#24408e
palette = 5=#a4407c
palette = 6=#1a6b7d
palette = 7=#8b8e88
# Bright — deepened for emphasis, not lightened
palette = 8=#6b7280
palette = 9=#9d1f24
palette = 10=#2c6f3c
palette = 11=#7d5a00
palette = 12=#1a2f6b
palette = 13=#7d2a5e
palette = 14=#0f5260
palette = 15=#b0b3ac

background-opacity = 0.90
