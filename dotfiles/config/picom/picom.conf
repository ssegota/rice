# ~/.config/picom/picom.conf — picom v12+
# Merged 2026-08-05: this file used to be two whole configs concatenated, with
# conflicting values (corner-radius 12 vs 8, inactive-opacity 0.9 vs 1.0, …).
# One config, one truth.

# ── Backend ──────────────────────────────────────────────────────────────────
backend = "glx";
vsync = true;
use-damage = true;

# ── Blur behind transparent windows ──────────────────────────────────────────
blur-method = "dual_kawase";
blur-strength = 5;            # 3 = subtle, 7 = heavy frosting
blur-background = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"       # stops blur bleeding into GTK's invisible CSD margin
];

# ── Rounded corners ───────────────────────────────────────────────────────────
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",         # rofi's theme sets its own border-radius
  "class_g = 'Dunst'"         # dunst draws its own corner_radius
];

# ── Shadows (subtle; tiled windows get busy fast) ─────────────────────────────
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.3;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "_NET_WM_STATE@ = '_NET_WM_STATE_FULLSCREEN'",
  "_GTK_FRAME_EXTENTS@"
];

# ── Fading on open/close/focus ────────────────────────────────────────────────
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# ── Opacity: apps manage their own ────────────────────────────────────────────
# ghostty and kitty set background-opacity 0.95 in their own configs;
# nothing else gets forced transparency.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

# ── Per-window-type tweaks ────────────────────────────────────────────────────
wintypes:
{
  tooltip = { fade = true; shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = false; };
  dropdown_menu = { opacity = 0.95; shadow = false; };
};

# ── Animations (picom v12+) ───────────────────────────────────────────────────
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "slide-in";
    direction = "up";
    duration = 0.2;
    match = "class_g = 'Guake'";   # was 'cladd_g' — the typo meant this never fired
  }
)
