#################################
#       Aesthetic Config        #
#################################

# General settings for a smooth, modern rice.

# Backend: Use glx for best performance and to enable blur/effects.
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

#################################
#             Fading            #
#################################

fading = true;
fade-delta = 6;              # The time between two opacity changes in ms.
fade-in-step = 0.03;         # Opacity change per fade step.
fade-out-step = 0.03;
no-fading-openclose = false; # Fade on window open/close.

# Fading exceptions for quick popups
# fade-exclude = [ "class_g = 'Rofi'" ];


#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 15;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.6;
shadow-exclude = [
    "class_g = 'Polybar'",      # Exclude your top bar
    "class_g = 'Rofi'",         # Exclude rofi if you use a full-screen theme
    "class_g = 'Dunst'",        # Exclude notification daemon
    "_NET_WM_STATE@:a = '_NET_WM_STATE_FULLSCREEN'",
    "_GTK_FRAME_EXTENTS@:c"
];

#################################
#            Opacity            #
#################################

active-opacity = 1.0;
inactive-opacity = 0.9;
frame-opacity = 0.9; # Opacity of the window frame/border (if drawn by WM)
inactive-opacity-override = false; # Allows 'inactive-opacity' to be overridden by opacity rules.

# Opacity rules for specific applications (Apply transparency here)
# Use 'xprop' in your terminal and click a window to find its class_g
opacity-rule = [
    "95:class_g = 'Alacritty'",     # 5% transparency for your terminal
    "95:class_g = 'kitty'",         # Another popular terminal
    "90:class_g = 'Rofi'",          # 10% transparency for Rofi
    "90:class_g = 'Dunst'",         # 10% transparency for notifications
    "100:class_g = 'Polybar'"       # Ensure your status bar is fully opaque
];

#################################
#              Blur             #
#################################

# NOTE: This requires a picom fork (like jonaburg's or ibhagwan's)
# that supports kawase or dual_kawase blur. The default picom package
# in many repos might not support it. Uncomment only if your version does.

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];


#################################
#           Corner Rounding     #
#################################

# NOTE: This also often requires a picom fork.
# Uncomment only if your picom version supports this.

corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'"
];


#################################
#           Window Type Rules   #
#################################

wintypes:
{
  normal = { fade = true; shadow = true; }
  tooltip = { fade = true; shadow = false; focus = true; full-shadow = false; }
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.9; }
  dropdown_menu = { opacity = 0.9; }
};

# ~/.config/picom/picom.conf

# --- Backend (glx required for decent blur perf) ---
backend = "glx";
vsync = true;
use-damage = true;

# --- Blur behind transparent windows ---
blur-method = "dual_kawase";
blur-strength = 5;            # 3 = subtle, 7 = heavy frosting
blur-background = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"     # stops blur bleeding into GTK's invisible CSD margin
];

# --- Rounded corners (picom v10+) ---
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Shadows (subtle; trim if it looks busy on tiled windows) ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.3;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Fading on open/close/focus ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# --- Keep all window opacity managed by the apps themselves ---
# (so only Ghostty's background-opacity makes it transparent, not everything)
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

animations = (
  {
    triggers = [ "open", "show" ];
    preset = "slide-in";
    direction = "up";
    duration = 0.2;
    match = "cladd_g = 'Guake'";
  }
)
